# 生产栈：目前只有 Inventory 的 API 一个容器，数据库用共享基建 infra_mysql 里的独立库，本项目不起数据库容器。
#
# 只在服务器上用，由 deploy/deploy.sh 驱动：它设置 INVENTORY_API_IMAGE 为本次提交 SHA 标记的镜像。
# 其余变量从服务器上本目录的 .env 读（模板见 .env.example），不进仓库。
#
# 接入方式沿用共享基建的约定：边缘反向代理在 proxy_net 上按服务名找到本项目，TLS 在它那层终止，
# 本项目不发布任何端口；data_net 连共享数据库。
# 服务名带 inventory_ 前缀：compose 把服务名注册成网络上的 DNS 别名，proxy_net 与 data_net 是多个项目共用的。
# 以后接 Stock Core 生产实例时，另加 Core 的内部网络（设计第 2 节），不在本次。

name: acuven_inventory

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  inventory_api:
    image: ${INVENTORY_API_IMAGE:?set by deploy/deploy.sh to the commit-tagged image}
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    environment:
      INVENTORY_DATABASE_URL: ${INVENTORY_DATABASE_URL:?set INVENTORY_DATABASE_URL in .env (see .env.example)}
    networks: [proxy_net, data_net]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy_net:
    external: true
  data_net:
    external: true
